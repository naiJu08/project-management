<!DOCTYPE html>
<html>
<head>
    <title>Video Call Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <h1>Video Call Connection Test</h1>
    <div id="status">Connecting...</div>
    <button onclick="testCall()">Test Incoming Call</button>
    <button onclick="checkConnection()">Check Connection</button>
    
    <script>
        const socket = io("http://localhost:3000");
        let userId = Math.floor(Math.random() * 1000);
        
        socket.on("connect", () => {
            document.getElementById("status").innerHTML = "✅ Connected to socket server (User ID: " + userId + ")";
            socket.emit("join-user", userId);
            console.log("✅ Connected as user:", userId);
        });
        
        socket.on("connect_error", (error) => {
            document.getElementById("status").innerHTML = "❌ Connection failed: " + error.message;
            console.error("❌ Connection failed:", error);
        });
        
        socket.on("offer", (data) => {
            alert("📹 Incoming video call from User " + data.callerUserId);
            console.log("🔥 Received offer:", data);
        });
        
        function testCall() {
            console.log("🧪 Testing call to user 999...");
            socket.emit("offer", {
                room: "test-room",
                targetUserId: 999,
                callerUserId: userId,
                offer: { type: "offer", sdp: "test-sdp" }
            });
        }
        
        function checkConnection() {
            alert("Socket connected: " + socket.connected + "\nSocket ID: " + socket.id);
        }
    </script>
</body>
</html>
